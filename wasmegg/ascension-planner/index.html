<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/static/favicon-128.png" />
    <link rel="canonical" href="https://egg.williamstest.fyi/ascension-planner/" />
    <title>Ascension Planner</title>
    <meta name="description" content="Ascension planner for Egg, Inc." />
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-100">
      <div class="app-loading p-4 text-center text-gray-500">Loading the planner…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- no_onload: the page counts itself once a player ID is out of the address, by path only
         (src/lib/urlPlayerId.ts). -->
    <script
      data-goatcounter="https://wasmegg-carpet.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
