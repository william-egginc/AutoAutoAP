<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- When the build has a collector (VITE_SUBMIT_URL), vite.config.ts `collectorEarlyStart` writes
         a preconnect to it and the start of its GET /all straight after the viewport tag, so the run
         list downloads alongside the scripts instead of after them. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Chain Explorer</title>
    <meta
      name="description"
      content="Submitted ascension chain searches, grouped by ascension count: where each checkpoint lands, how each leg goes, and whether a shape repeats across accounts."
    />
  </head>
  <body>
    <div id="app" class="min-h-screen bg-slate-100">
      <div class="p-4 text-center text-gray-500">Loading the explorer...</div>
    </div>
    <script type="module" src="/src/explorer/main.ts"></script>
  </body>
</html>
